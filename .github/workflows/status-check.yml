name: xSentry CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build
        run: go build -v ./cmd/xSentry

      - name: Test
        run: go test ./...

      - name: Lint
        run: go fmt ./...

      - name: Scan with xSentry
        env:
          XSENTRY_EVENT_NAME: ${{ github.event_name }}
          XSENTRY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          XSENTRY_HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$XSENTRY_EVENT_NAME" = "schedule" ] || [ "$XSENTRY_EVENT_NAME" = "workflow_dispatch" ]; then
            ./xSentry -path="." --scan-history
          elif [ -z "$XSENTRY_BASE_SHA" ] || [ "$XSENTRY_BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            ./xSentry -path="." --scan-history
          else
            ./xSentry -path="." -base="$XSENTRY_BASE_SHA" -head="$XSENTRY_HEAD_SHA"
          fi
